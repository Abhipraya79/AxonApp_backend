name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via Portainer Webhook
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Portainer Deployment
        run: |
          echo "🚀 Triggering Portainer webhook deployment..."
          curl -X POST ${{ secrets.PORTAINER_WEBHOOK_URL }}
          echo "✅ Webhook triggered successfully"

      - name: Deployment Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎯 Deployment Status"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Branch: main"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Webhook: Triggered"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Portainer will now:"
          echo "1. Pull latest code from repository"
          echo "2. Rebuild Docker image"
          echo "3. Deploy updated container"
          echo "4. Run Prisma migrations (if configured)"
